# Daily Mailing MA 컨텍스트 팩 — 한국MSD 자산 + 계열별 직접 경쟁약 (큐레이션).
# 파서: agents/daily_mailing/ma_context.py (PyYAML 없음 — 아래 형태만: 'key:' + '- k: v' 항목, [a, b] 인라인 리스트, "따옴표", # 주석).
#
# 항목 키
#   brand_kr(필수) · brand_en · ingredient(한글 성분) · inn · class · company · aliases · note
#   price_match      drug_prices.product_name_kr 접두 (기본 brand_kr) — 다중 SKU 는 비교 단위 SKU 로 고정
#   indication_slug  indications_master.product (기본 brand_en 소문자)
#   enrichment_name  drug_enrichment.normalized_name 접두 (기본 price_match)
#   rsa / rsa_type   큐레이션 RSA 여부 — DB(drug_enrichment.is_rsa) 가 NULL 일 때만 사용. 확인 전에는 쓰지 않는다.
#   watch_for        (경쟁약) 압박하는 MSD 자산 brand_kr 목록 — 등록된 자산이어야 로드된다
#
# 출처: scope_validation.MSD_BRANDS · competitor_brand(anchor) · product_alias_map · drug_prices 2026.07.01 · CLAUDE.md
# 확신 없는 항목은 needs_review 에만 둔다 (팩에 들어가지 않음). 사용자 확인 후 msd_assets/competitors 로 옮긴다.
