  - name: 팜뉴스
    domains: [pharmnews.com, www.pharmnews.com]
    source_tier: media_tier_B
    tier: B
    country: KR
    language: ko
    weight: 2.2
    volume: 4
    novelty: 3
    ma_depth: 4
    desc: 제약 마케팅·급여 정책 전문. 사용량 연동 인하 보도.
    use_for: [candidate_links, ma_policy_context, pricing_context]

  - name: 메디게이트뉴스
    domains: [medigatenews.com, www.medigatenews.com]
    source_tier: media_tier_B
    tier: B
    country: KR
    language: ko
    weight: 2.1
    volume: 4
    novelty: 3
    ma_depth: 3
    desc: 의사·병원 대상 전문 매체. 급여 적용 임상 관련 보도.
    use_for: [candidate_links, clinical_context, hospital_context]

  - name: 약사공론
    domains: [kpanews.co.kr, www.kpanews.co.kr]
    source_tier: media_tier_B
    tier: B
    country: KR
    language: ko
    weight: 2.1
    volume: 4
    novelty: 3
    ma_depth: 4
    desc: 약사회 계열 의약 전문지. 약제 급여·약평위·정책 인사 신호 보도.
    use_for: [candidate_links, ma_policy_context, pharmacy_policy_context]

  # Strategic signal / newsletter calibration source
  - name: BioSpectator
    domains: [biospectator.com, www.biospectator.com]
    source_tier: strategic_signal_media
    tier: B_strategic
    country: KR
    language: ko
    weight: 2.0
    newsletter_aliases: [BioSpectator, 바이오스펙테이터, 바스픽]
    paywall_policy: respect_access_controls
    use_for: [candidate_links, calibration_reference, biotech_bd_signal, modality_theme_tracking]

  # Search/API channel, not an authority source by itself
  - name: Naver News API
    domains: [openapi.naver.com, n.news.naver.com, news.naver.com]
    source_tier: search_channel
    country: KR
    language: ko
    weight: 1.0
    use_for: [discovery, dedupe, recency_scan]
    validation_note: Naver API is a discovery channel; final source tier should be assigned from the linked publisher domain, not from Naver itself.

scoring_defaults:
  tier_weight_multiplier:
    official: 2.0
    official_payer: 2.0
    regulator: 2.0
    media_tier_A: 1.35
    media_tier_B: 1.15
    strategic_signal_media: 1.05
    search_channel: 0.80
  minimum_top_signal_conditions:
    - source_tier in [official, official_payer, regulator]
    - media_tier_A_or_B_with_cross_source_confirmation
    - msd_direct_relevance_and_ma_depth_at_least_4
    - high_recurrence_theme_with_clinical_access_competitor_axes

editorial_defaults:
  item_order:
    - news_insight
    - why_it_matters
    - korea_ma_implication
    - msd_or_competitor_impact
    - next_watch
    - sources_and_caveats
  principle: 뉴스 자체의 핵심 인사이트를 먼저 정리한 뒤 Korea MA implication을 붙인다.

validation_defaults:
  require_publisher_page_for_briefing_facts: true
  respect_paywalls_and_login: true
  max_redirects: 5
  request_timeout_seconds: 12
  daily_briefing_preferred_recency_hours: 72
  naver_api_is_discovery_only: true

privacy_defaults:
  redact_personal_email_addresses: true
  preserve_raw_email_private: true
  raw_retention_days_pilot: 90
  no_live_gmail_mutation_without_confirmation: true
