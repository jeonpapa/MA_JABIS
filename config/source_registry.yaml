    volume: 5
    novelty: 4
    ma_depth: 5
    desc: 국내 최장수 제약·약가 전문 신문. 급여 고시·약가 협상 심층 보도.
    use_for: [candidate_links, top_signal_candidate, ma_policy_context]

  - name: 메디파나뉴스
