    use_for: [candidate_links, top_signal_candidate, ma_policy_context]

  - name: 히트뉴스
    domains: [hitnews.co.kr, www.hitnews.co.kr]
    source_tier: media_tier_A
    tier: A
    country: KR
    language: ko
    weight: 2.7
    volume: 4
    novelty: 5
    ma_depth: 4
    desc: 의약 전문 인터넷 매체. 보험등재·약가 단독 속보 비중 높음.
    use_for: [candidate_links, top_signal_candidate, ma_policy_context]

  - name: 청년의사
    domains: [docdocdoc.co.kr, www.docdocdoc.co.kr]
    source_tier: media_tier_B
    tier: B
    country: KR
    language: ko
    weight: 2.4
    volume: 4
    novelty: 4
    ma_depth: 3
    desc: 의사 대상 전문지. 임상 적응증 확대·급여 결정 보도 활발.
    use_for: [candidate_links, clinical_context, reimbursement_context]

  - name: 메디칼타임즈
    domains: [medicaltimes.com, www.medicaltimes.com]
    source_tier: media_tier_B
    tier: B
    country: KR
    language: ko
    weight: 2.3
    volume: 4
    novelty: 3
    ma_depth: 3
    desc: 의사 대상 온라인 의료지. 보험급여 정책 기사 다수.
    use_for: [candidate_links, clinical_context, reimbursement_context]

  - name: 뉴스더보이스
    domains: [newsthevoice.com, www.newsthevoice.com]
    source_tier: media_tier_B
    tier: B
    country: KR
    language: ko
    weight: 2.3
    volume: 4
    novelty: 4
    ma_depth: 4
    desc: 의약 전문 온라인. 위험분담·급여 확대 보도 심층.
