  - name: HIRA
    domains: [hira.or.kr, www.hira.or.kr]
    source_tier: official_payer
    country: KR
    language: ko
    weight: 5.0
    use_for: [verification, primary_facts, reimbursement_facts]

  - name: MFDS
    domains: [mfds.go.kr, www.mfds.go.kr]
    source_tier: regulator
    country: KR
    language: ko
    weight: 5.0
    use_for: [verification, primary_facts, regulatory_facts]

